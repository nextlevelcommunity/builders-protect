name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - run: swift test
      - run: make dmg
      - name: Prepare release asset
        run: |
          cd dist
          cp "Builders Protect.dmg" "Builders.Protect.dmg"
          shasum -a 256 "Builders.Protect.dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "Builders Protect $TAG"
          fi
          gh release upload "$TAG" \
            "dist/Builders.Protect.dmg" \
            "dist/SHA256SUMS.txt" \
            --clobber
