name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - run: swift test
      - run: make dmg
      - name: Assinar e notarizar (quando há segredos)
        if: env.HAS_SIGNING == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain"
          security create-keychain -p "$DEVELOPER_ID_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$DEVELOPER_ID_PASSWORD" "$KC"
          echo "$DEVELOPER_ID_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$DEVELOPER_ID_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$DEVELOPER_ID_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          codesign --force --options runtime --timestamp --entitlements Resources/BuildersProtect.entitlements \
            --sign "Developer ID Application" "dist/Builders Protect.app"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" "dist/Builders Protect.dmg"
          xcrun notarytool submit "dist/Builders Protect.dmg" --key ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER" --wait
          xcrun stapler staple "dist/Builders Protect.dmg"
          xcrun stapler staple "dist/Builders Protect.app"
          spctl -a -vvv -t exec "dist/Builders Protect.app"
      - name: Checagem de artefato
        run: ./scripts/release-check.sh
        env:
          BP_SKIP_LAUNCH: "1"
      - name: Prepare release asset
        run: |
          cd dist
          cp "Builders Protect.dmg" "Builders-Protect-${TAG}.dmg"
          shasum -a 256 "Builders-Protect-${TAG}.dmg" > "SHA256SUMS-${TAG}.txt"
          cat "SHA256SUMS-${TAG}.txt"
        env:
          TAG: ${{ github.ref_name }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "Builders Protect $TAG"
          fi
          gh release upload "$TAG" \
            "dist/Builders-Protect-${TAG}.dmg" \
            "dist/SHA256SUMS-${TAG}.txt" \
            --clobber

  cli:
    name: Package CLI (Linux, Windows, macOS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - name: Pack CLI tarball
        run: |
          npm pack
          mkdir dist
          mv *.tgz dist/
        shell: bash
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "Builders Protect $TAG"
          fi
          gh release upload "$TAG" dist/*.tgz --clobber
        shell: bash

  windows:
    name: Build Windows portable CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - name: Assemble portable Windows zip
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not (gh release view "$TAG" 2>$null)) {
            gh release create "$TAG" --generate-notes --title "Builders Protect $TAG"
          }
          gh release upload "$TAG" `
            "dist/Builders-Protect-CLI-windows-x64.zip" `
            "dist/Builders-Protect-CLI-windows-x64.zip.sha256" `
            --clobber
        shell: pwsh
